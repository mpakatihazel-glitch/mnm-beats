        .beat-grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding-bottom: 50px; }
        @media (min-width: 768px) { .beat-grid { grid-template-columns: 1fr 1fr; } }

        .beat-card { 
            background: var(--grey); 
            border: 1px solid #222; 
            padding: 15px; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            transition: 0.3s; 
            position: relative; 
            width: 100%;
            overflow: hidden;
        }

        .beat-card:hover:not(.sold) { border-color: var(--red); transform: translateY(-3px); }

        .beat-img { width: 60px; height: 60px; border-radius: 6px; margin-right: 12px; object-fit: cover; border: 1px solid #333; flex-shrink: 0; }
        .play-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--red); border: none; color: white; cursor: pointer; margin-right: 12px; flex-shrink: 0; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; }

        .beat-info { flex-grow: 1; min-width: 0; } 
        .beat-info h3 { margin: 0; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .beat-info p { margin: 5px 0 0; font-size: 0.7rem; color: #666; cursor: default; }

        .price { font-weight: 900; color: var(--red); margin: 0 10px; font-size: 0.85rem; }
        .buy-btn { background: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 900; font-size: 0.7rem; cursor: pointer; flex-shrink: 0; }

        .sold .buy-btn { display: none; }
        .sold-label { position: absolute; right: 10px; top: 15px; color: var(--red); font-family: 'Syncopate'; font-size: 0.6rem; border: 2px solid var(--red); padding: 3px; transform: rotate(-10deg); background: rgba(5,5,5,0.8); }

        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); border-top: 2px solid var(--red); padding: 15px 0 25px 0; z-index: 100; }
        .progress-bg { width: 100%; height: 4px; background: #222; margin-bottom: 10px; }
        #progress-fill { height: 100%; background: var(--red); width: 0%; transition: linear; }

        const grid = document.getElementById('beatGrid');
        const searchInput = document.getElementById('beatSearch');
        const mainAudio = document.getElementById('mainAudio');
        const progressFill = document.getElementById('progress-fill');
        const playerBar = document.getElementById('playerBar');
        const nowPlayingTitle = document.getElementById('nowPlayingTitle');
        const timeDisplay = document.getElementById('timeDisplay');

        function render(filter = "") {
            grid.innerHTML = "";
            const filteredBeats = beats.filter(b => b.title.toLowerCase().includes(filter.toLowerCase()));

            filteredBeats.forEach(beat => {
                const card = document.createElement('div');
                card.className = `beat-card ${beat.sold ? 'sold' : ''}`;
                card.innerHTML = `
                    <img src="${beat.image}" class="beat-img">
                    <button class="play-btn" onclick="togglePlay('${beat.audio}', '${beat.title}', this)">▶</button>
                    <div class="beat-info">
                        <h3>${beat.title}</h3>
                        <p>${beat.bpm} BPM</p>
                    </div>
                    ${beat.sold ? '<div class="sold-label">SOLD</div>' : `<div class="price">${beat.price}</div><button class="buy-btn" onclick="buyEmail(${beat.id})">BUY</button>`}
                `;
                grid.appendChild(card);
            });
        }

        function togglePlay(file, title, btn) {
            if (mainAudio.src.includes(file)) {
                if (mainAudio.paused) {
                    mainAudio.play();
                    btn.innerText = "⏸";
                } else {
                    mainAudio.pause();
                    btn.innerText = "▶";
                }
            } else {
                resetButtons();
                mainAudio.src = file;
                mainAudio.play();
                btn.innerText = "⏸";
                playerBar.style.display = "block";
                nowPlayingTitle.innerText = "STREAMING: " + title;
            }
        }

        function stopAudio() {
            mainAudio.pause();
            mainAudio.currentTime = 0;
            playerBar.style.display = "none";
            resetButtons();
        }

        function resetButtons() {
            document.querySelectorAll('.play-btn').forEach(b => b.innerText = "▶");
        }

        mainAudio.onended = () => {
            resetButtons();
            playerBar.style.display = "none";
        };

        mainAudio.ontimeupdate = () => {
            if (mainAudio.duration) {
                const pct = (mainAudio.currentTime / mainAudio.duration) * 100;
                progressFill.style.width = pct + "%";
                let mins = Math.floor(mainAudio.currentTime / 60);
                let secs = Math.floor(mainAudio.currentTime % 60);
                timeDisplay.innerText = `${mins}:${secs < 10 ? '0'+secs : secs}`;
            }
        };

        function buyEmail(id) {
            const beat = beats.find(b => b.id === id);
            window.location.href = `mailto:mpakatihazel@gmail.com?subject=Purchase: ${beat.title}&body=I'm interested in buying ${beat.title}. What are the next steps?`;
